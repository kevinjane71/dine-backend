name: Build DineOpen Server (desktop)

# Builds the self-contained on-prem "DineOpen Server" desktop app (Electron + the
# whole dine-backend + embedded PostgreSQL) for Windows and macOS. Mirrors the main
# POS workflow in dine-frontend, but the Server app has NO native node modules to
# rebuild and NO Next.js step — it just bundles the backend as extraResources.
#
# The per-OS Postgres binary comes from embedded-postgres' optional deps
# (@embedded-postgres/<os>): each runner's `npm ci` in the backend installs its own
# OS binary, which is exactly why Windows builds on windows-latest and mac on macos.
#
# Trigger: push a tag like `server-v1.0.1` (kept separate from the POS `v*` tags),
# or run manually via "Run workflow".

on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:

jobs:
  # ── Windows (primary target) ────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-server/package-lock.json

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # server-v1.0.1 -> 1.0.1
            VERSION="${GITHUB_REF_NAME#server-v}"
          else
            VERSION=$(node -p "require('./desktop-server/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set app version
        shell: bash
        run: |
          cd desktop-server
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install backend deps (bundled — pulls @embedded-postgres/windows-x64)
        run: npm ci

      - name: Install desktop-server deps (electron + electron-builder)
        run: npm ci
        working-directory: desktop-server

      - name: Build Windows installer (NSIS, unsigned)
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never
        working-directory: desktop-server

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DineOpen-Server-Windows-v${{ steps.version.outputs.version }}
          path: |
            desktop-server/dist/*Setup*.exe
            desktop-server/dist/*.exe.blockmap
            desktop-server/dist/latest.yml
          retention-days: 30
          if-no-files-found: error

  # ── macOS (Apple Silicon + Intel, two DMGs, unsigned) ───────────────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-server/package-lock.json

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#server-v}"
          else
            VERSION=$(node -p "require('./desktop-server/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set app version
        run: |
          cd desktop-server
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install backend deps (bundled — pulls @embedded-postgres/darwin-arm64)
        run: npm ci

      # The runner is Apple Silicon, so `npm ci` only fetched the arm64 Postgres binary.
      # The x64 DMG needs the Intel binary bundled, so pull it too (force past the
      # platform check; --no-save keeps the lockfile clean).
      - name: Add Intel Postgres binary for the x64 DMG
        run: npm install @embedded-postgres/darwin-x64@18.4.0-beta.17 --no-save --force

      - name: Install desktop-server deps (electron + electron-builder)
        run: npm ci
        working-directory: desktop-server

      # Build TWO separate DMGs (arm64 + x64) rather than one --universal binary:
      # @electron/universal's lipo merge can't reconcile the identical embedded-postgres
      # Mach-O binaries (initdb etc.) that live in extraResources. Two DMGs sidestep the
      # merge entirely and still cover both Apple Silicon and Intel Macs.
      - name: Build macOS DMGs (arm64 + Intel, unsigned)
        env:
          # Explicitly disable code signing / notarization — unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        working-directory: desktop-server

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DineOpen-Server-macOS-v${{ steps.version.outputs.version }}
          path: |
            desktop-server/dist/*.dmg
            desktop-server/dist/*.dmg.blockmap
          retention-days: 30
          if-no-files-found: error

  # ── Publish a GitHub Release with the installers attached ───────────────────
  # Runs only on a server-v* tag push (not manual dispatch). Gives a permanent,
  # public, one-click download page — no login, no zip, never expires — unlike the
  # per-run Artifacts above.
  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release (exe + dmgs attached)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DineOpen Server ${{ github.ref_name }}
          body: |
            Self-contained on-prem **DineOpen Server** (backend + embedded PostgreSQL).
            Install on the ONE machine that acts as the restaurant's local server; every
            terminal on the LAN connects to it for full offline operation.

            **Downloads**
            - **Windows:** `DineOpen-Server-Setup-*.exe` — SmartScreen → *More info* → *Run anyway* (unsigned).
            - **macOS (Apple Silicon):** `DineOpen-Server-*-arm64.dmg`
            - **macOS (Intel):** `DineOpen-Server-*-x64.dmg`
            - macOS: right-click → *Open* the first time (unsigned).
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          fail_on_unmatched_files: true
