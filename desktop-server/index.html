<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>DineOpen Server</title>
  <style>
    :root { --bg:#0b1120; --panel:#111a2e; --ink:#e7edf7; --muted:#8695b0; --accent:#8b93ff; --good:#56d68a; --border:#22304b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { padding:22px; }
    .head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .dot { width:12px; height:12px; border-radius:50%; background:var(--good); box-shadow:0 0 0 4px rgba(86,214,138,0.18); }
    h1 { font-size:18px; margin:0; font-weight:800; }
    .sub { color:var(--muted); font-size:12.5px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
    .lbl { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:8px; }
    .addr { display:flex; align-items:center; gap:8px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; font-weight:700; color:var(--accent); padding:8px 10px; background:#0e1626; border:1px solid var(--border); border-radius:8px; margin:4px 0; }
    .addr button { margin-left:auto; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:3px 8px; cursor:pointer; font-size:11px; }
    pre { margin:0; background:#0a1120; border:1px solid var(--border); border-radius:8px; padding:12px; height:210px; overflow:auto; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:#a9b6d0; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="dot"></span>
      <div>
        <h1>DineOpen Server — running</h1>
        <div class="sub">Keep this app open. Every terminal on this Wi-Fi connects here.</div>
      </div>
    </div>

    <div class="card">
      <div class="lbl">Terminals connect to</div>
      <div id="addrs"></div>
      <div class="sub" style="margin-top:6px">Enter one of these in each terminal → Settings → Local Server.</div>
    </div>

    <div class="card">
      <div class="lbl">Activity</div>
      <pre id="log"></pre>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
